[plugin]

name="Safe Mod Loader (Zero-Trust Sandbox)"
description="Cybersecurity-hardened runtime mod loader for Godot 4.x games. Eliminates RCE vulnerabilities by prohibiting executable code (.pck / .gd) and loading only in-memory sanitized data assets (.zip, .png, .ogg, .glb, .json)."
author="Estudio Eclipse"
version="1.0.0"
script="safe_mod_loader.gd"
